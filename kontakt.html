<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – Cykelverkstan Kedjan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Cykelverkstan Kedjan</h1>
    <nav>
      <ul class="meny">
        <li><a href="index.html">Hem</a></li>
        <li><a href="tjanster.html">Tjänster</a></li>
        <li><a href="priser.html">Priser</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Boka service</h2>
    <form action="#" method="post">
      <div class="falt">
        <label for="namn">Namn *</label><br>
        <input type="text" id="namn" name="namn" autocomplete="name" placeholder="Ditt namn" required>
      </div>

      <div class="falt">
        <label for="epost">E-post *</label><br>
        <input type="email" id="epost" name="epost" autocomplete="email" placeholder="namn@exempel.com" required>
      </div>

      <div class="falt">
        <label for="telefon">Telefon</label><br>
        <input type="tel" id="telefon" name="telefon" autocomplete="tel">
      </div>

      <div class="falt">
        <label for="datum">Önskat datum *</label><br>
        <input type="date" id="datum" name="datum" required>
      </div>

      <fieldset>
        <legend>Vad ska vi göra</legend>

        <input type="checkbox" id="punk" name="jobb" value="punktering">
        <label for="punk">Punktering</label>

        <input type="checkbox" id="kedja" name="jobb" value="kedja">
        <label for="kedja">Kedja</label>

        <input type="checkbox" id="service" name="jobb" value="service">
        <label for="service">Service</label>
      </fieldset>

      <input type="checkbox" id="samtycke" name="samtycke" value="samtycke" required>
      <label for="samtycke">Jag godkänner att Cykelverkstan Kedjan sparar mina uppgifter för bokningen. *</label><br>

      <button type="submit" class="knapp">Skicka bokning</button>
      </form>
  </main>

  <footer>
    <address>
      Hornsgatan 12, 118 20 Stockholm<br>
      Tel: <a href="tel:+46812345678">08-123 456 78</a>
    </address>
  </footer>
</body>
</html>
